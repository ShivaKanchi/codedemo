<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Three.js Galaxy and Black Hole</title>
        <style>
        body { margin: 0; overflow: hidden; background-color: #000000; } /* True black background */
        canvas { display: block; }
        </style>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
        let scene, camera, renderer;
        let shapes = []; // Array for the shapes
        let particles; // Variable for the particle system
        let blackHole; // Variable for the black hole object
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        const shapeCount = 80; // Slightly fewer shapes
        const particleCount = 20000; // Even more particles for density
        let ambientLight; // Only ambient light for a darker space feel

        // Initialize the scene
        function init() {
            // Create a scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // True black background

            // Create a camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50; // Move camera further back to see the whole galaxy

            // Create a renderer
            renderer = new THREE.WebGLRenderer({ antialias: true }); // Enable antialiasing
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add subtle ambient light
            ambientLight = new THREE.AmbientLight(0x101010); // Very dim ambient light
            scene.add(ambientLight);

            // Create shapes
            createShapes();

            // Create particles
            createParticles();

            // Create the black hole
            createBlackHole();

            // Add event listeners for interactivity
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('click', onDocumentMouseClick, false);
            window.addEventListener('resize', onWindowResize, false);
        }

        // Function to create various shapes (planets, asteroids)
        function createShapes() {
            const geometries = [
                new THREE.SphereGeometry(1, 32, 32), // Larger spheres
                new THREE.BoxGeometry(1.5, 1.5, 1.5),
                new THREE.ConeGeometry(1, 2, 32),
                new THREE.TorusGeometry(0.8, 0.3, 16, 100),
                new THREE.CylinderGeometry(0.8, 0.8, 1.5, 32)
            ];

            const colors = [0x4682B4, 0x8A2BE2, 0x00CED1, 0xFF6347, 0xDAA520, 0x7CFC00, 0xFF69B4]; // Space-like colors

            for (let i = 0; i < shapeCount; i++) {
                const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                const material = new THREE.MeshPhongMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    specular: 0xaaaaaa, // Grey specular
                    shininess: 50,
                    flatShading: true
                });

                const mesh = new THREE.Mesh(geometry, material);

                // Set random position within a large spherical area
                const radius = Math.random() * 30 + 10; // Spawn further out
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                mesh.position.x = radius * Math.sin(phi) * Math.cos(theta);
                mesh.position.y = radius * Math.sin(phi) * Math.sin(theta);
                mesh.position.z = radius * Math.cos(phi);


                // Random initial rotation
                mesh.rotation.x = Math.random() * Math.PI * 2;
                mesh.rotation.y = Math.random() * Math.PI * 2;
                mesh.rotation.z = Math.random() * Math.PI * 2;

                // Store initial position, rotation speed, and a velocity vector
                mesh.userData.initialPosition = mesh.position.clone();
                mesh.userData.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.002, // Slower rotation
                    (Math.random() - 0.5) * 0.002,
                    (Math.random() - 0.5) * 0.002
                );
                 mesh.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1, // Initial random velocity
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                 );


                scene.add(mesh);
                shapes.push(mesh);
            }
        }

        // Function to create a particle system (stars, dust)
        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const color = new THREE.Color();

            const particleColors = [0xffffff, 0xffffdd, 0xffeecc, 0xffeebb, 0xffccaa]; // Shades of white/yellow for stars

            for (let i = 0; i < particleCount; i++) {
                // Random position within a large spherical area
                const radius = Math.random() * 50 + 5; // Spawn further out than shapes
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions.push(radius * Math.sin(phi) * Math.cos(theta));
                positions.push(radius * Math.sin(phi) * Math.sin(theta));
                positions.push(radius * Math.cos(phi));

                // Assign a random color to each particle
                color.set(particleColors[Math.floor(Math.random() * particleColors.length)]);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); // Use vertex colors

            const material = new THREE.PointsMaterial({
                size: 0.05, // Smaller particle size
                vertexColors: true, // Use colors from the geometry
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending // Additive blending for glowing effect
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // Function to create the black hole
        function createBlackHole() {
            const geometry = new THREE.SphereGeometry(3, 64, 64); // Larger sphere for black hole
            const material = new THREE.MeshBasicMaterial({
                color: 0x000000, // Black color
                specular: 0x000000, // No specular highlight
                shininess: 0, // No shininess
                transparent: true,
                opacity: 0.8 // Slightly transparent to see through
            });
             // Add a subtle emissive color to the material to make it slightly visible in the dark
            material.emissive = new THREE.Color(0x1a1a1a);
            material.emissiveIntensity = 0.5;


            blackHole = new THREE.Mesh(geometry, material);
            scene.add(blackHole);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001; // Get time for animations
            const blackHolePosition = blackHole.position;
            const gravitationalConstant = 0.005; // Strength of the gravitational pull

            // Animate shapes
            shapes.forEach(obj => {
                // Apply random rotation speed
                obj.rotation.x += obj.userData.rotationSpeed.x;
                obj.rotation.y += obj.userData.rotationSpeed.y;
                obj.rotation.z += obj.userData.rotationSpeed.z;

                // Calculate gravitational pull towards the black hole
                const directionToBlackHole = new THREE.Vector3().subVectors(blackHolePosition, obj.position);
                const distance = directionToBlackHole.length();

                // Apply gravitational force (inversely proportional to distance squared, but capped to avoid extreme forces)
                if (distance > 0.5) { // Avoid division by zero and extreme forces very close
                     const force = directionToBlackHole.normalize().multiplyScalar(gravitationalConstant / (distance * distance));
                     obj.userData.velocity.add(force);
                }


                // Update position based on velocity
                obj.position.add(obj.userData.velocity);

                 // Simple boundary check to prevent objects from flying too far out
                 if (obj.position.length() > 60) {
                     obj.position.copy(obj.userData.initialPosition); // Reset to initial position
                      obj.userData.velocity.set((Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1); // Reset velocity
                 }
            });

            // Animate particles (subtle movement and gravitational pull)
            const particlePositions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const particleIndex = i * 3;
                const particlePosition = new THREE.Vector3(particlePositions[particleIndex], particlePositions[particleIndex + 1], particlePositions[particleIndex + 2]);

                // Calculate gravitational pull towards the black hole
                const directionToBlackHole = new THREE.Vector3().subVectors(blackHolePosition, particlePosition);
                const distance = directionToBlackHole.length();

                 // Apply gravitational force (inversely proportional to distance squared, but capped)
                if (distance > 0.1) { // Avoid division by zero and extreme forces
                     const force = directionToBlackHole.normalize().multiplyScalar(gravitationalConstant * 0.5 / (distance * distance)); // Weaker pull for particles
                     particlePositions[particleIndex] += force.x;
                     particlePositions[particleIndex + 1] += force.y;
                     particlePositions[particleIndex + 2] += force.z;
                }


                 // Add a small random drift
                particlePositions[particleIndex] += (Math.random() - 0.5) * 0.005;
                particlePositions[particleIndex + 1] += (Math.random() - 0.5) * 0.005;
                particlePositions[particleIndex + 2] += (Math.random() - 0.5) * 0.005;

                 // Simple boundary check to keep particles somewhat contained
                 if (particlePosition.length() > 70) {
                     // Reset particle to a random position further out
                     const radius = Math.random() * 50 + 5;
                     const theta = Math.random() * Math.PI * 2;
                     const phi = Math.acos((Math.random() * 2) - 1);
                     particlePositions[particleIndex] = radius * Math.sin(phi) * Math.cos(theta);
                     particlePositions[particleIndex + 1] = radius * Math.sin(phi) * Math.sin(theta);
                     particlePositions[particleIndex + 2] = radius * Math.cos(phi);
                 }
            }
            particles.geometry.attributes.position.needsUpdate = true; // Important to update the buffer geometry

            // Move camera based on mouse position
            camera.position.x += (mouseX * 0.03 - camera.position.x) * 0.01; // Even slower camera movement
            camera.position.y += (-mouseY * 0.03 - camera.position.y) * 0.01;
            camera.lookAt(scene.position); // Make camera look at the center of the scene

            renderer.render(scene, camera);
        }

        // Handle mouse movement
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        }

        // Handle mouse click - Create a temporary outward force (supernova effect)
        function onDocumentMouseClick(event) {
             const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects([...shapes, particles]); // Check intersection with shapes and particles

            if (intersects.length > 0) {
                const clickPoint = intersects[0].point;

                // Apply outward force to shapes
                shapes.forEach(obj => {
                    const distance = obj.position.distanceTo(clickPoint);
                    if (distance < 15) { // Affect shapes within a larger radius
                        const direction = new THREE.Vector3().subVectors(obj.position, clickPoint).normalize();
                        const forceMagnitude = (15 - distance) * 0.5; // Stronger force closer to the click
                        obj.userData.velocity.add(direction.multiplyScalar(forceMagnitude)); // Add force to velocity
                    }
                });

                 // Apply outward force to particles
                const particlePositions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const particleIndex = i * 3;
                    const particlePosition = new THREE.Vector3(particlePositions[particleIndex], particlePositions[particleIndex + 1], particlePositions[particleIndex + 2]);
                    const distance = particlePosition.distanceTo(clickPoint);

                    if (distance < 20) { // Affect particles within an even larger radius
                        const direction = new THREE.Vector3().subVectors(particlePosition, clickPoint).normalize();
                        const forceMagnitude = (20 - distance) * 1; // Stronger force for particles
                        particlePositions[particleIndex] += direction.x * forceMagnitude;
                        particlePositions[particleIndex + 1] += direction.y * forceMagnitude;
                        particlePositions[particleIndex + 2] += direction.z * forceMagnitude;
                    }
                }
                 particles.geometry.attributes.position.needsUpdate = true; // Update particle positions

            } else {
                 // If no object is clicked, move the black hole slightly
                 blackHole.position.x += (Math.random() - 0.5) * 5;
                 blackHole.position.y += (Math.random() - 0.5) * 5;
                 blackHole.position.z += (Math.random() - 0.5) * 5;
            }
        }

        // Handle window resize
        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the application when the window loads
        window.onload = function () {
            init();
            animate();
        }
        </script>
    </body>
</html>
