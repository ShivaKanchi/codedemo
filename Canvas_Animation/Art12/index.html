<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain Simulation</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      let raindrops = [];
      let maxRaindrops = 500;
      let splashParticles = [];

      function setup() {
        createCanvas(800, 600);
        for (let i = 0; i < maxRaindrops; i++) {
          raindrops.push(new Raindrop());
        }
      }

      function draw() {
        background(25, 25, 112); // Dark blue for a night sky

        // Update and display raindrops
        for (let i = raindrops.length - 1; i >= 0; i--) {
          raindrops[i].fall();
          raindrops[i].display();

          if (raindrops[i].isSplashing()) {
            for (let j = 0; j < 5; j++) {
              // Create 5 splash particles per drop
              splashParticles.push(
                new SplashParticle(raindrops[i].x, raindrops[i].y)
              );
            }
            raindrops.splice(i, 1); // Remove the raindrop
            if (raindrops.length < maxRaindrops) {
              raindrops.push(new Raindrop()); // Add a new raindrop to maintain density
            }
          }
        }

        // Update and display splash particles
        for (let i = splashParticles.length - 1; i >= 0; i--) {
          splashParticles[i].update();
          splashParticles[i].display();
          if (splashParticles[i].isFinished()) {
            splashParticles.splice(i, 1);
          }
        }

        // Add new raindrops if needed
        while (raindrops.length < maxRaindrops) {
          raindrops.push(new Raindrop());
        }
      }

      class Raindrop {
        constructor() {
          this.x = random(width);
          this.y = random(-500, -50); // Start off-screen
          this.z = random(0, 20); // For parallax effect and size variation
          this.len = map(this.z, 0, 20, 10, 20);
          this.speed = map(this.z, 0, 20, 4, 10);
          this.gravity = map(this.z, 0, 20, 0.05, 0.2);
          this.thickness = map(this.z, 0, 20, 1, 3);
        }

        fall() {
          this.y += this.speed;
          this.speed += this.gravity; // Accelerate due to gravity
        }

        display() {
          stroke(200, 200, 255, 200); // Light blueish white
          strokeWeight(this.thickness);
          line(this.x, this.y, this.x, this.y + this.len);
        }

        isSplashing() {
          return this.y > height;
        }
      }

      class SplashParticle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.velX = random(-2, 2);
          this.velY = random(-5, -2);
          this.lifespan = 255;
          this.gravity = 0.2;
          this.size = random(1, 3);
        }

        update() {
          this.x += this.velX;
          this.y += this.velY;
          this.velY += this.gravity;
          this.lifespan -= 10;
        }

        display() {
          noStroke();
          fill(200, 200, 255, this.lifespan);
          ellipse(this.x, this.y, this.size, this.size);
        }

        isFinished() {
          return this.lifespan < 0;
        }
      }
    </script>
  </body>
</html>
