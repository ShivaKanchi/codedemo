<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>INSANE Three.js Visualizer (Even Cooler)</title>
        <style>
        body { margin: 0; overflow: hidden; background-color: #050505; } /* Even darker background */
        canvas { display: block; }
        </style>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
        let scene, camera, renderer;
        let shapes = []; // Array for the shapes
        let particles; // Variable for the particle system
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        const shapeCount = 100; // Reduced shape count to make room for particles
        const particleCount = 10000; // Increased particle count significantly
        let ambientLight, directionalLight1, directionalLight2; // More lights

        // Initialize the scene
        function init() {
            // Create a scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505); // Very dark background

            // Create a camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25; // Move camera further back

            // Create a renderer
            renderer = new THREE.WebGLRenderer({ antialias: true }); // Enable antialiasing
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add lights
            ambientLight = new THREE.AmbientLight(0x202020); // Softer ambient light
            scene.add(ambientLight);

            directionalLight1 = new THREE.DirectionalLight(0xff00ff, 0.7); // Magenta light
            directionalLight1.position.set(5, 5, 5).normalize();
            scene.add(directionalLight1);

            directionalLight2 = new THREE.DirectionalLight(0x00ffff, 0.7); // Cyan light
            directionalLight2.position.set(-5, -5, -5).normalize();
            scene.add(directionalLight2);

            // Create shapes
            createShapes();

            // Create particles
            createParticles();

            // Add event listeners for interactivity
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('click', onDocumentMouseClick, false);
            window.addEventListener('resize', onWindowResize, false);
        }

        // Function to create various shapes
        function createShapes() {
            const geometries = [
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.SphereGeometry(0.6, 20, 20),
                new THREE.ConeGeometry(0.5, 1, 20),
                new THREE.TorusGeometry(0.4, 0.15, 12, 80),
                new THREE.CylinderGeometry(0.4, 0.4, 0.8, 20)
            ];

            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500, 0x800080, 0x008080, 0x800000, 0x4682B4, 0xD2B48C]; // More colors

            for (let i = 0; i < shapeCount; i++) {
                const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                const material = new THREE.MeshPhongMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    specular: 0xffffff, // White specular for shininess
                    shininess: 100, // High shininess
                    flatShading: true
                });

                const mesh = new THREE.Mesh(geometry, material);

                // Set random position within a larger area
                mesh.position.x = (Math.random() - 0.5) * 40;
                mesh.position.y = (Math.random() - 0.5) * 40;
                mesh.position.z = (Math.random() - 0.5) * 40;

                // Random initial rotation
                mesh.rotation.x = Math.random() * Math.PI * 2;
                mesh.rotation.y = Math.random() * Math.PI * 2;
                mesh.rotation.z = Math.random() * Math.PI * 2;

                // Store initial position and a random rotation speed
                mesh.userData.initialPosition = mesh.position.clone();
                mesh.userData.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.005, // Slower rotation
                    (Math.random() - 0.5) * 0.005,
                    (Math.random() - 0.5) * 0.005
                );
                mesh.userData.pulseSpeed = Math.random() * 0.03 + 0.005; // Speed for pulsing effect
                mesh.userData.pulseFactor = Math.random() * Math.PI * 2; // Starting point for pulse

                scene.add(mesh);
                shapes.push(mesh);
            }
        }

        // Function to create a particle system
        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const color = new THREE.Color();

            const particleColors = [0xffffff, 0xffff00, 0x00ffff, 0xff00ff]; // White, Yellow, Cyan, Magenta for particles

            for (let i = 0; i < particleCount; i++) {
                // Random position within an even larger area
                positions.push((Math.random() - 0.5) * 60);
                positions.push((Math.random() - 0.5) * 60);
                positions.push((Math.random() - 0.5) * 60);

                // Assign a random color to each particle
                color.set(particleColors[Math.floor(Math.random() * particleColors.length)]);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); // Use vertex colors

            const material = new THREE.PointsMaterial({
                size: 0.1, // Particle size
                vertexColors: true, // Use colors from the geometry
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending // Additive blending for glowing effect
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001; // Get time for animations

            // Animate shapes
            shapes.forEach(obj => {
                // Apply random rotation speed
                obj.rotation.x += obj.userData.rotationSpeed.x;
                obj.rotation.y += obj.userData.rotationSpeed.y;
                obj.rotation.z += obj.userData.rotationSpeed.z;

                // Simple pulsing scale effect
                obj.userData.pulseFactor += obj.userData.pulseSpeed;
                const scale = 1 + Math.sin(obj.userData.pulseFactor) * 0.1; // Smaller pulse
                obj.scale.set(scale, scale, scale);

                // Add some subtle floating movement based on time
                obj.position.x = obj.userData.initialPosition.x + Math.sin(time * 0.3 + obj.userData.initialPosition.y) * 0.8; // Slower and larger movement
                obj.position.y = obj.userData.initialPosition.y + Math.cos(time * 0.3 + obj.userData.initialPosition.x) * 0.8;
                obj.position.z = obj.userData.initialPosition.z + Math.sin(time * 0.3 + obj.userData.initialPosition.z) * 0.8;
            });

            // Animate particles (subtle movement or scaling)
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                // Example: Subtle vertical movement based on time
                positions[i * 3 + 1] += Math.sin(time * 2 + i * 0.1) * 0.001; // Modify Y position
                 // Add a small random drift
                positions[i * 3] += (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 1] += (Math.random() - 0.5) * 0.01;
                positions[i * 3 + 2] += (Math.random() - 0.5) * 0.01;

                 // Simple boundary check to keep particles somewhat contained
                 if (Math.abs(positions[i * 3]) > 30) positions[i * 3] *= 0.95;
                 if (Math.abs(positions[i * 3 + 1]) > 30) positions[i * 3 + 1] *= 0.95;
                 if (Math.abs(positions[i * 3 + 2]) > 30) positions[i * 3 + 2] *= 0.95;
            }
            particles.geometry.attributes.position.needsUpdate = true; // Important to update the buffer geometry

            // Move camera based on mouse position
            camera.position.x += (mouseX * 0.05 - camera.position.x) * 0.02; // Even slower camera movement
            camera.position.y += (-mouseY * 0.05 - camera.position.y) * 0.02;
            camera.lookAt(scene.position); // Make camera look at the center of the scene

            renderer.render(scene, camera);
        }

        // Handle mouse movement
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        }

        // Handle mouse click - Apply a small force to nearby objects (shapes and particles)
        function onDocumentMouseClick(event) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check for intersections with shapes
            const shapeIntersects = raycaster.intersectObjects(shapes);

            if (shapeIntersects.length > 0) {
                const clickPoint = shapeIntersects[0].point;

                // Affect shapes
                shapes.forEach(obj => {
                    const distance = obj.position.distanceTo(clickPoint);
                    if (distance < 8) { // Affect shapes within a certain radius
                        const direction = new THREE.Vector3().subVectors(obj.position, clickPoint).normalize();
                        const forceMagnitude = (8 - distance) * 0.2; // Stronger force closer to the click
                        obj.position.add(direction.multiplyScalar(forceMagnitude));

                        // Also give them a little spin
                        obj.userData.rotationSpeed.x += direction.y * 0.02;
                        obj.userData.rotationSpeed.y += direction.x * 0.02;
                        obj.userData.rotationSpeed.z += direction.z * 0.02;
                    }
                });

                 // Affect nearby particles
                const particlePositions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const particlePosition = new THREE.Vector3(particlePositions[i * 3], particlePositions[i * 3 + 1], particlePositions[i * 3 + 2]);
                    const distance = particlePosition.distanceTo(clickPoint);

                    if (distance < 10) { // Affect particles within a larger radius
                        const direction = new THREE.Vector3().subVectors(particlePosition, clickPoint).normalize();
                        const forceMagnitude = (10 - distance) * 0.5; // Stronger force closer to the click
                        particlePositions[i * 3] += direction.x * forceMagnitude;
                        particlePositions[i * 3 + 1] += direction.y * forceMagnitude;
                        particlePositions[i * 3 + 2] += direction.z * forceMagnitude;
                    }
                }
                 particles.geometry.attributes.position.needsUpdate = true; // Update particle positions

            } else {
                 // If no shape is clicked, change the color of the directional lights
                 const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500, 0x800080, 0x4682B4, 0xD2B48C];
                 directionalLight1.color.set(colors[Math.floor(Math.random() * colors.length)]);
                 directionalLight2.color.set(colors[Math.floor(Math.random() * colors.length)]);
            }
        }

        // Handle window resize
        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the application when the window loads
        window.onload = function () {
            init();
            animate();
        }
        </script>
    </body>
</html>
